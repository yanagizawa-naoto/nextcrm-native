name: Native macOS

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
          run_install: false
      - name: Install locked build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify public sources and memory units
        run: python3 scripts/verify-publication.py
      - name: Record Apple toolchain
        run: |
          swiftc --version
          xcrun --sdk macosx --show-sdk-version
          xcode-select -p
          xcrun --find swiftc
      - name: SQLite smoke tests with isolated data
        run: zsh desktop/native/smoke-test.sh
      - name: Distribution configuration and account authentication
        run: |
          python3 desktop/native/test-distribution-configuration.py
          python3 desktop/native/chatgpt-test.py
          python3 desktop/native/google-mail-test.py
          python3 desktop/native/google-mail-transport-test.py
          python3 desktop/native/native-mail-transport-test.py
      - name: Restored provider review regression (433 checks)
        run: python3 desktop/native/test-provider-review.py
      - name: Account login UI using the same verified application module
        run: python3 desktop/native/test-distribution-login-ui.py
      - name: Build and verify the native application
        run: zsh desktop/native/build.sh
      - name: Reverify public sources
        run: python3 scripts/verify-publication.py
